}

    text-decoration: none;

    border: 1px solid #650000;

    padding: 12px 18px;

    border-radius: 5px;

    background: #180000;
}

.nav-button:hover {
    background: #650000;
}


/* FOOTER */

footer {
    text-align: center;
    padding: 35px 20px;

    background: #030303;

    color: #666;

    border-top: 1px solid #1c0000;
}


/* MOBILE */

@media (max-width:600px) {

    h1 {
        font-size: 27px;
    }

    .story p {
        font-size: 17px;
    }

    .navigation {
        flex-direction: column;

</head>
